; Terrasense - firmware del Arduino Uno
; Compilar:            pio run
; Compilar y cargar:   pio run -t upload
; Monitor serie:       pio device monitor
; Simular en Wokwi:    F1 -> "Wokwi: Start Simulator" (compilar primero)

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600          ; tiene que coincidir con el Serial.begin() del codigo

; PlatformIO las descarga solo la primera vez que compilas.
; Quedan en .pio/libdeps/uno/ y no se versionan.
lib_deps =
    adafruit/DHT sensor library
    adafruit/Adafruit Unified Sensor
    paulstoffregen/OneWire
    milesburton/DallasTemperature
